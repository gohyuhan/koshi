[workspace]
resolver = "2"
members = [
    "crates/koshi",
    "crates/koshi-client",
    "crates/koshi-core",
    "crates/koshi-daemon",
    "crates/koshi-runtime",
    "crates/koshi-session",
    "crates/koshi-layout",
    "crates/koshi-link",
    "crates/koshi-pane",
    "crates/koshi-pty",
    "crates/koshi-terminal",
    "crates/koshi-renderer",
    "crates/koshi-input",
    "crates/koshi-config",
    "crates/koshi-beta",
    "crates/koshi-macro",
    "crates/koshi-plugin-api",
    "crates/koshi-plugin-host",
    "crates/koshi-plugin-manager",
    "crates/koshi-ipc",
    "crates/koshi-storage",
    "crates/koshi-observability",
    "crates/koshi-paths",
    "crates/koshi-test-support",
    "xtask",
]

[workspace.package]
version = "0.4.0-pr.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
base64 = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
fs4 = "1.1.0"
libc = "0.2.189"
proptest = "1.11.0"
ratatui = { version = "0.30.2", default-features = false }
rcgen = { version = "0.14.9", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23.43", default-features = false, features = [
  "aws_lc_rs",
  "logging",
  "prefer-post-quantum",
  "std",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }
