[workspace]
resolver = "2"
members = [
    "crates/koshi",
    "crates/koshi-client",
    "crates/koshi-core",
    "crates/koshi-daemon",
    "crates/koshi-error",
    "crates/koshi-runtime",
    "crates/koshi-session",
    "crates/koshi-layout",
    "crates/koshi-link",
    "crates/koshi-pane",
    "crates/koshi-pty",
    "crates/koshi-terminal",
    "crates/koshi-renderer",
    "crates/koshi-input",
    "crates/koshi-config",
    "crates/koshi-beta",
    "crates/koshi-macro",
    "crates/koshi-plugin-api",
    "crates/koshi-plugin-host",
    "crates/koshi-plugin-manager",
    "crates/koshi-ipc",
    "crates/koshi-storage",
    "crates/koshi-observability",
    "crates/koshi-paths",
    "crates/koshi-test-support",
    "xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
proptest = "1.11.0"
serde_json = { version = "1.0.151", features = ["raw_value"] }
tempfile = "3.27.0"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
