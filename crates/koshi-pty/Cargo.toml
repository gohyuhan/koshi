[package]
name = "koshi-pty"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
portable-pty = "0.9.0"
thiserror = "2.0.18"
koshi-core = { version = "0.2.0", path = "../koshi-core" }
koshi-ipc = { version = "0.2.0", path = "../koshi-ipc" }

[target."cfg(unix)".dependencies]
nix = { version = "0.28", features = ["signal", "hostname", "poll", "event", "process"] }
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
tempfile.workspace = true
