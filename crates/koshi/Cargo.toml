[package]
name = "koshi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "koshi"
path = "src/lib.rs"

[[bin]]
name = "koshi"
path = "src/main.rs"

[dependencies]
koshi-client = { version = "0.4.0-pr.1", path = "../koshi-client" }
koshi-config = { version = "0.4.0-pr.1", path = "../koshi-config" }
koshi-core = { version = "0.4.0-pr.1", path = "../koshi-core" }
koshi-daemon = { version = "0.4.0-pr.1", path = "../koshi-daemon" }
koshi-link = { version = "0.4.0-pr.1", path = "../koshi-link" }
koshi-ipc = { version = "0.4.0-pr.1", path = "../koshi-ipc" }
koshi-layout = { version = "0.4.0-pr.1", path = "../koshi-layout" }
koshi-observability = { version = "0.4.0-pr.1", path = "../koshi-observability" }
koshi-paths = { version = "0.4.0-pr.1", path = "../koshi-paths" }
koshi-storage = { version = "0.4.0-pr.1", path = "../koshi-storage" }
tracing.workspace = true
clap.workspace = true
uuid.workspace = true
serde_json.workspace = true
serde.workspace = true
ureq = { version = "3.3.0", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }
semver = "1.0.28"
flate2 = "1.1.9"
tar = "0.4.46"
# koshi only reads a deflate-compressed release zip, so drop zip's default
# codec backends (bzip2, ppmd, lzma, zstd, xz) — that also removes their
# non-permissive transitive licenses. `deflate-flate2` reuses the flate2
# already pulled for tar.gz.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
tempfile.workspace = true

[target."cfg(unix)".dependencies]
libc.workspace = true

[dev-dependencies]
koshi-pty = { version = "0.4.0-pr.1", path = "../koshi-pty" }
koshi-runtime = { version = "0.4.0-pr.1", path = "../koshi-runtime" }
koshi-test-support = { version = "0.4.0-pr.1", path = "../koshi-test-support" }
