[package]
name = "koshi-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
koshi-config = { version = "0.4.0", path = "../koshi-config" }
koshi-core = { version = "0.4.0", path = "../koshi-core" }
koshi-observability = { version = "0.4.0", path = "../koshi-observability" }
koshi-input = { version = "0.4.0", path = "../koshi-input" }
koshi-ipc = { version = "0.4.0", path = "../koshi-ipc" }
koshi-iterm = { version = "0.4.0", path = "../koshi-iterm" }
koshi-image = { version = "0.4.0", path = "../koshi-image" }
koshi-kitty = { version = "0.4.0", path = "../koshi-kitty" }
koshi-link = { version = "0.4.0", path = "../koshi-link" }
koshi-paths = { version = "0.4.0", path = "../koshi-paths" }
koshi-renderer = { version = "0.4.0", path = "../koshi-renderer" }
koshi-sixel = { version = "0.4.0", path = "../koshi-sixel" }
koshi-runtime = { version = "0.4.0", path = "../koshi-runtime" }
koshi-terminal = { version = "0.4.0", path = "../koshi-terminal" }
ratatui = { workspace = true, features = ["crossterm"] }
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true

[dev-dependencies]
base64.workspace = true
koshi-layout = { version = "0.4.0", path = "../koshi-layout" }
koshi-pty = { version = "0.4.0", path = "../koshi-pty" }
koshi-test-support = { version = "0.4.0", path = "../koshi-test-support" }

[target."cfg(unix)".dependencies]
libc.workspace = true
rustix = { version = "1", default-features = false, features = ["std", "stdio", "termios", "event"] }
signal-hook = "0.3"

[target."cfg(windows)".dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
