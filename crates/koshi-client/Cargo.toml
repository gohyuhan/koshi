[package]
name = "koshi-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
koshi-config = { version = "0.2.0", path = "../koshi-config" }
koshi-core = { version = "0.2.0", path = "../koshi-core" }
koshi-observability = { version = "0.2.0", path = "../koshi-observability" }
koshi-input = { version = "0.2.0", path = "../koshi-input" }
koshi-ipc = { version = "0.2.0", path = "../koshi-ipc" }
koshi-layout = { version = "0.2.0", path = "../koshi-layout" }
koshi-link = { version = "0.2.0", path = "../koshi-link" }
koshi-paths = { version = "0.2.0", path = "../koshi-paths" }
koshi-renderer = { version = "0.2.0", path = "../koshi-renderer" }
koshi-runtime = { version = "0.2.0", path = "../koshi-runtime" }
koshi-terminal = { version = "0.2.0", path = "../koshi-terminal" }
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
uuid = "1.23.4"
tracing = "0.1.44"

[dev-dependencies]
koshi-layout = { path = "../koshi-layout" }
koshi-pty = { path = "../koshi-pty" }
koshi-test-support = { path = "../koshi-test-support" }
tempfile = "3.27.0"
