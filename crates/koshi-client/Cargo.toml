[package]
name = "koshi-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
koshi-config.workspace = true
koshi-core.workspace = true
koshi-image.workspace = true
koshi-input.workspace = true
koshi-ipc.workspace = true
koshi-iterm.workspace = true
koshi-kitty.workspace = true
koshi-layout.workspace = true
koshi-link.workspace = true
koshi-observability.workspace = true
koshi-paths.workspace = true
koshi-renderer.workspace = true
koshi-runtime.workspace = true
koshi-sixel.workspace = true
koshi-terminal.workspace = true
ratatui = { workspace = true, features = ["crossterm"] }
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["event", "std", "stdio", "termios"] }
signal-hook.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Threading",
] }

[dev-dependencies]
base64.workspace = true
koshi-pty.workspace = true
koshi-test-support.workspace = true
