[package]
name = "koshi-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
koshi-config = { version = "0.3.0-pr.2", path = "../koshi-config" }
koshi-core = { version = "0.3.0-pr.2", path = "../koshi-core" }
koshi-input = { version = "0.3.0-pr.2", path = "../koshi-input" }
koshi-ipc = { version = "0.3.0-pr.2", path = "../koshi-ipc" }
koshi-layout = { version = "0.3.0-pr.2", path = "../koshi-layout" }
koshi-observability = { version = "0.3.0-pr.2", path = "../koshi-observability" }
koshi-pane = { version = "0.3.0-pr.2", path = "../koshi-pane" }
koshi-paths = { version = "0.3.0-pr.2", path = "../koshi-paths" }
koshi-pty = { version = "0.3.0-pr.2", path = "../koshi-pty" }
koshi-renderer = { version = "0.3.0-pr.2", path = "../koshi-renderer" }
koshi-session = { version = "0.3.0-pr.2", path = "../koshi-session" }
koshi-storage = { version = "0.3.0-pr.2", path = "../koshi-storage" }
koshi-terminal = { version = "0.3.0-pr.2", path = "../koshi-terminal" }
ratatui = { version = "0.30.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json.workspace = true
subtle = "2.6.1"
tracing = "0.1.44"

[dev-dependencies]
# Tests only: the end-to-end key tests drive a real viewer, which resolves the
# press before the session sees it. koshi-client does not depend on this crate,
# so this adds no cycle.
koshi-client = { version = "0.3.0-pr.2", path = "../koshi-client" }
koshi-test-support = { version = "0.3.0-pr.2", path = "../koshi-test-support" }
tempfile.workspace = true
uuid.workspace = true
