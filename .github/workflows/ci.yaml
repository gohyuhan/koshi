name: ci

on:
  push:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  formatting:
    name: fmt + clippy
    runs-on: ubuntu-latest
    # This job compiles the workspace, which includes `aws-lc-sys`: a vendored
    # C library that rustls's aws-lc-rs provider builds before any crate using
    # TLS. A cold cache pays that compile once per run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in rust-toolchain.toml (channel +
      # rustfmt/clippy components) and configures build caching. No version
      # is named here: rust-toolchain.toml alone sets it.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: "" # keep the workflow-level RUSTFLAGS (-D warnings)

      - name: Format
        run: cargo fmt --all -- --check

      # --locked: the build uses exactly the versions Cargo.lock pins, and
      # fails when Cargo.lock needs a change.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  dep-guard:
    name: dependency guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: formatting
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Dependency-direction guard
        run: cargo xtask dep-guard

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: dep-guard
    steps:
      - uses: actions/checkout@v7

      # Audits dependencies against deny.toml with the compiler version that
      # rust-toolchain.toml pins, whose cargo reads the version 4 Cargo.lock.
      - name: Audit dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.96.0"
          command: check advisories bans licenses sources

  test:
    name: test (${{ matrix.os }})
    needs: cargo-deny
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Compiles the workspace on each of the three runners, including the
    # `aws-lc-sys` C library described on the fmt + clippy job.
    timeout-minutes: 25
    # The Windows runner adds -C target-feature=+crt-static, the flag the
    # Windows release binaries build with: it links the C runtime into each
    # binary.
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # Lints every target on each runner, including the code that only one
      # operating system compiles.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # Documents every crate on each runner, including the items that only
      # one operating system compiles. rustdoc reads RUSTDOCFLAGS, not the
      # job-level RUSTFLAGS.
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      # --no-fail-fast: every crate's tests run even after one fails, and the
      # run reports every failure.
      - name: Test
        run: cargo test --workspace --all-features --locked --no-fail-fast

      # The second-user tests skip without root: only root may take on
      # another user id. This step runs them as root through the passwordless
      # sudo of the Linux and macOS runners, and does not run on Windows.
      # `env "PATH=$PATH"` carries the runner's cargo past sudo's PATH reset.
      # The flags match the step above, and the step reuses the test binary
      # that step built.
      - name: Test as a second user
        if: runner.os != 'Windows'
        run: sudo -E env "PATH=$PATH" cargo test -p koshi --test other_user_access --all-features --locked
